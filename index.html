    <div class="backDrop formClose" id="backDrop"></div>
        <form action="" class="mainForm" id="mainForm">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h3>Add Movie</h3>
                    <i class="fa-solid fa-xmark fa-2x formClose"></i>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="movieName">Movie Name</label>
                        <input type="text" class="form-control" id="movieName">
                    </div>

                    <div class="form-group">
                        <label for="movieImg">Movie Image</label>
                        <input type="text" class="form-control" id="movieImg">
                    </div>

                    <div class="form-group">
                        <label for="movieDescription">Movie Description</label>
                        <input type="text" class="form-control" id="movieDescription">
                    </div>

                    <div class="form-group">
                        <label for="movieRating">Movie Rating</label>
                        <select id="movieRating" class="form-control">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>

                        </select>
                    </div>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <button type="submit" class="btn net-sec-btn btn-sm" id="addMovie">Add Movie</button>
                    <button type="button" class="btn net-sec-btn btn-sm d-none" id="updateMovie">Update Movie</button>
